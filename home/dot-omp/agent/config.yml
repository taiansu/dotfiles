setupVersion: 2
modelRoles:
  smol: openai-codex/gpt-6-luna
  slow: openai-codex/gpt-6-astra:xhigh
  plan: anthropic/claude-5-opus:high
  designer: anthropic/claude-5-opus:high
  commit: google-antigravity/gemini-3.8-flash
  advisor: openai-codex/gpt-6-sol
  task: google-antigravity/gemini-3.8-flash:high
  tiny: openai-codex/gpt-6-luna
  vision: openai-codex/gpt-6-sol
  default: openai-codex/gpt-6-astra:xhigh
  web: web/tavily
retry:
  enabled: true
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    default:
      - openai-codex/gpt-6-astra:xhigh
      - openai-codex/gpt-6-sol:xhigh
      - anthropic-api/claude-fable-5-1:xhigh
      - anthropic/claude-opus-5
    task:
      - anthropic/claude-sonnet-5
      - openai-codex/gpt-6-sol
    smol:
      - anthropic/claude-haiku-4-5
      - openai/gpt-6-luna
    web:
      - web/brave
      - web/kagi
      - web/parallel
      - web/perplexity
      - google/gemini-2.5-flash
      - google-antigravity/gemini-2.5-flash
      - anthropic/claude-haiku-4-5
      - openai-codex/gpt-6-luna
      - openai-codex/gpt-6
      - openai-codex/gpt-5.5
      - xai/grok-4.5
      - xai-oauth/grok-4.5
      - web/exa
      - web/tinyfish
      - web/jina
      - web/firecrawl
      - web/synthetic
      - web/ollama
      - web/searxng
      - web/startpage
      - web/duckduckgo
      - web/ecosia
      - web/google
      - web/mojeek
      - web/public
dev:
  autoqaConsent: granted
theme:
  dark: dark-lunar-custom
  light: light-zenith
statusLine:
  separator: none
  transparent: true
  preset: custom
  leftSegments:
    - pi
    - vim
    - model
    - mode
    - collab
    - stream
    - path
    - git
    - pr
    - context_pct
    - cost
    - usage
  rightSegments:
    - session_name
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
shellMinimizer:
  enabled: false
browser:
  enabled: true
  relay: true
composer:
  shape: rule
tui:
  textSizing: true
  scrollbackRebuild: true
symbolPreset: nerd
# task:
#   agentModelOverrides:
#     task: anthropic/claude-opus-5
extendedContext: true
codexResets:
  autoRedeem: "yes"
  salvageHorizonHours: 0.5
  minBlockedMinutes: 360
  keepCredits: 1
completion:
  notify: "off"
