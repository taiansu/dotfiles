setupVersion: 2
modelRoles:
  smol: openai-codex/gpt-5.6-luna
  slow: openai-codex/gpt-6-astra:xhigh
  plan: anthropic/claude-5-opus:high
  designer: anthropic/claude-5-opus:high
  commit: google-antigravity/gemini-3.7-flash
  advisor: openai-codex/gpt-5.6-sol
  task: google-antigravity/gemini-3.8-flash:high
  tiny: openai-codex/gpt-5.6-luna
  vision: openai-codex/gpt-5.6-sol
  default: openai-codex/gpt-6-astra:xhigh
retry:
  enabled: true
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    default:
      - openai-codex/gpt-6-astra:xhigh
      - openai-codex/gpt-5.6-sol:xhigh
      - anthropic/claude-opus-5
      - anthropic-api/claude-fable-5-1:xhigh
    task:
      - anthropic/claude-sonnet-5
      - openai-codex/gpt-5.6-sol:high
    smol:
      - anthropic/claude-haiku-4-5
      - openai/gpt-5.6-luna
dev:
  autoqaConsent: granted
theme:
  dark: dark-lunar-custom
  light: light-zenith
statusLine:
  separator: none
  transparent: true
  preset: custom
  leftSegments:
    - pi
    - vim
    - model
    - mode
    - collab
    - stream
    - path
    - git
    - pr
    - context_pct
    - cost
    - usage
  rightSegments:
    - session_name
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
shellMinimizer:
  enabled: false
providers:
  webSearchOrder:
    - tavily
    - brave
    - kagi
  judgmentProvider: auto
browser:
  enabled: true
  relay: true
composer:
  shape: rule
tui:
  textSizing: true
  scrollbackRebuild: true
symbolPreset: nerd
task:
  agentModelOverrides:
    task: anthropic/claude-opus-5
extendedContext: true
codexResets:
  autoRedeem: "yes"
  salvageHorizonHours: 0.5
  minBlockedMinutes: 360
  keepCredits: 1