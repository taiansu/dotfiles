providers:
  anthropic-api:
    baseUrl: https://api.anthropic.com
    api: anthropic-messages
    apiKey: ANTHROPIC_FABLE_API_KEY
    models:
      - id: claude-fable-5-1
        name: Claude Fable 5.1 (API)
        reasoning: true
        thinking:
          mode: anthropic-adaptive
          efforts: [low, medium, high, xhigh, max]
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 128000
        cost:
          input: 10
          output: 50
          cacheRead: 0.25
          cacheWrite: 12.5
